[theme]
# Aspetto scuro "terminale da prodotto" (2026-11-24, scelto dall'utente; è l'aspetto predefinito): fondo #0b0e13,
# superfici #11151c/#171c24, accento verde acqua, angoli piccoli. Il tema chiaro sta in ui/common.LIGHT_THEME:
# _apply_theme cambia queste opzioni mentre gira e ricorda la scelta in data/preferenze_interfaccia.json (menu "Dati":
# Scuro, Chiaro, Segui il sistema). Niente [theme.light]/[theme.dark] qui: con quelle sezioni Streamlit sceglierebbe
# il tema nel browser e il codice Python (colori dei grafici, CSS) non saprebbe quale è attivo. Valori uguali ai token
# TOKENS_DARK di ui/common.py.
base = "dark"
primaryColor = "#2dd4bf"
backgroundColor = "#0b0e13"
secondaryBackgroundColor = "#171c24"
textColor = "#e6edf3"
linkColor = "#2dd4bf"
borderColor = "#5b6576"   # bordo dei controlli: >= 3:1 sul fondo
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "Inter, -apple-system, BlinkMacSystemFont, SF Pro Text, Segoe UI, Roboto, Helvetica Neue, sans-serif"
headingFont = "Inter, -apple-system, BlinkMacSystemFont, SF Pro Text, Segoe UI, Roboto, Helvetica Neue, sans-serif"
codeFont = "monospace"
baseFontSize = 14
dataframeBorderColor = "#222934"
dataframeHeaderBackgroundColor = "#11151c"
dataframeHeaderTextColor = "#8b949e"
greenColor = "#3fb950"
redColor = "#f85149"
orangeColor = "#d29922"
blueColor = "#58a6ff"
# palette dei grafici validata su #11151c e #0b0e13 (blu, arancio, viola, oro, rosa): stessi valori di ui/common.SERIES
chartCategoricalColors = ["#3b86e8", "#d0732f", "#a371f7", "#a8831a", "#db61a2"]

[theme.sidebar]
backgroundColor = "#0e1218"
secondaryBackgroundColor = "#171c24"
textColor = "#e6edf3"

[client]
# niente "Deploy" né menu per sviluppatori
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
