[theme]
# Aspetto scuro in stile Apple (2026-11-23): nero con schede #1c1c1e, blu di sistema, pulsanti a pillola. Il tema chiaro, base
# del prodotto, sta in ui/common.LIGHT_THEME: _apply_theme cambia queste opzioni mentre gira e ricorda la scelta in
# data/preferenze_interfaccia.json (menu "Dati": Segui il sistema, Scuro, Chiaro). Niente [theme.light]/[theme.dark]
# qui: con quelle sezioni Streamlit sceglierebbe il tema nel browser e il codice Python (colori dei grafici, CSS) non
# saprebbe quale è attivo. Valori uguali ai token TOKENS_DARK di ui/common.py.
base = "dark"
primaryColor = "#0a84ff"
backgroundColor = "#000000"
secondaryBackgroundColor = "#2c2c2e"
textColor = "#f5f5f7"
linkColor = "#2997ff"
borderColor = "#7c7c80"   # bordo dei controlli: >= 3:1 sul fondo
showWidgetBorder = true
baseRadius = "12px"
buttonRadius = "full"
font = "-apple-system, BlinkMacSystemFont, SF Pro Text, Helvetica Neue, Inter, Segoe UI, Roboto, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, SF Pro Text, Helvetica Neue, Inter, Segoe UI, Roboto, sans-serif"
codeFont = "monospace"
baseFontSize = 14
dataframeBorderColor = "#38383a"
dataframeHeaderBackgroundColor = "#1c1c1e"
dataframeHeaderTextColor = "#98989d"
greenColor = "#30d158"
redColor = "#ff453a"
orangeColor = "#ff9f0a"
blueColor = "#0a84ff"
# palette dei grafici validata su #1c1c1e e #000000 (blu, arancio, viola, verde, rosa): stessi valori di ui/common.SERIES
chartCategoricalColors = ["#0a84ff", "#d97800", "#bf5af2", "#28a745", "#e8508a"]

[theme.sidebar]
backgroundColor = "#161617"
secondaryBackgroundColor = "#2c2c2e"
textColor = "#f5f5f7"

[client]
# niente "Deploy" né menu per sviluppatori
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
